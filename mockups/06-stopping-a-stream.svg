<svg xmlns="http://www.w3.org/2000/svg" width="780" height="156" viewBox="0 0 780 156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="The stop button on a stream and the question it asks"><title>The stop button on a stream and the question it asks</title><rect width="780" height="156" rx="6" fill="#1a1a1a"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#42a5f5"/></marker></defs><rect x="14" y="14" width="360" height="54" rx="4" fill="#2e2e2e" stroke="rgba(255,255,255,.10)"/><rect x="14" y="15" width="3.5" height="52" rx="1.5" fill="#4caf50"/><rect x="26" y="22" width="38" height="15" rx="3" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.10)"/><text x="45.0" y="32.8" fill="rgba(255,255,255,.85)" font-size="8.5" text-anchor="middle" font-weight="700">1080</text><rect x="68" y="22" width="62" height="15" rx="3" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.10)"/><text x="99.0" y="32.8" fill="rgba(255,255,255,.45)" font-size="8.5" text-anchor="middle" font-weight="700">8.4 Mbps</text><rect x="285" y="22" width="79" height="15" rx="3" fill="rgba(76,175,80,0.15)" stroke="rgba(76,175,80,0.32)"/><text x="324.5" y="32.8" fill="#4caf50" font-size="8.5" text-anchor="middle" font-weight="700">DIRECT PLAY</text><rect x="237" y="22" width="44" height="15" rx="3" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.10)"/><text x="259.0" y="32.8" fill="rgba(255,255,255,.85)" font-size="8.5" text-anchor="middle" font-weight="700">TOWER</text><rect x="195" y="22" width="38" height="15" rx="3" fill="rgba(229,160,13,0.15)" stroke="rgba(229,160,13,0.32)"/><text x="214.0" y="32.8" fill="#e5a00d" font-size="8.5" text-anchor="middle" font-weight="700">PLEX</text><path transform="translate(26 45)" d="M2 1.5h8v9H2zM4.4 1.5v9M7.6 1.5v9" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 47l8 4.0-8 4.0z" fill="#4caf50"/><rect x="58" y="47" width="8" height="8" rx="1.5" fill="#e24b4a"/><text x="74" y="55" fill="rgba(255,255,255,.85)" font-size="11.5" text-anchor="start" font-weight="600">Dune: Part Two</text><path d="M62 96L62 59" stroke="#42a5f5" stroke-width="1.6" marker-end="url(#a)"/><text x="26" y="112" fill="#42a5f5" font-size="10.5" text-anchor="start" font-weight="600">The red square stops the stream. It is there only</text><text x="26" y="127" fill="#42a5f5" font-size="10.5" text-anchor="start" font-weight="600">when Allow killing sessions is switched on.</text><rect x="400" y="14" width="366" height="128" rx="4" fill="#242424" stroke="rgba(255,255,255,.18)"/><path transform="translate(577 24)" d="M6 1.6l4.6 8.4H1.4zM6 5v2.2M6 8.5v.2" fill="none" stroke="#e5a00d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="583" y="54" fill="rgba(255,255,255,.85)" font-size="12" text-anchor="middle" font-weight="700">Stop stream</text><text x="583" y="74" fill="rgba(255,255,255,.65)" font-size="10.5" text-anchor="middle" font-weight="normal">Stop stream &quot;Dune: Part Two&quot;?</text><text x="583" y="89" fill="rgba(255,255,255,.65)" font-size="10.5" text-anchor="middle" font-weight="normal">This will immediately disconnect the user.</text><path d="M400 104h366" stroke="rgba(255,255,255,.10)" opacity="1"/><rect x="630" y="112" width="60" height="22" rx="3" fill="#2e2e2e" stroke="rgba(255,255,255,.18)"/><text x="660.0" y="126.8" fill="rgba(255,255,255,.65)" font-size="10" text-anchor="middle" font-weight="600">Cancel</text><rect x="696" y="112" width="58" height="22" rx="3" fill="rgba(226,75,74,0.14)" stroke="rgba(226,75,74,0.4)"/><text x="725.0" y="126.8" fill="#e24b4a" font-size="10" text-anchor="middle" font-weight="600">Stop</text></svg>