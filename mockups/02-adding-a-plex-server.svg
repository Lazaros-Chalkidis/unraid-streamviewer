<svg xmlns="http://www.w3.org/2000/svg" width="780" height="298" viewBox="0 0 780 298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Picking the address of a Plex server after signing in"><title>Picking the address of a Plex server after signing in</title><rect width="780" height="298" rx="6" fill="#1a1a1a"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#42a5f5"/></marker></defs><rect x="14" y="14" width="506" height="190" rx="4" fill="#242424" stroke="rgba(255,255,255,.10)"/><path d="M26 24l9 4.5-9 4.5z" fill="#e5a00d"/><text x="42" y="32.5" fill="rgba(255,255,255,.85)" font-size="12" text-anchor="start" font-weight="600">Add Plex Servers</text><rect x="420" y="20.5" width="88" height="15" rx="3" fill="rgba(244,125,66,0.15)" stroke="rgba(244,125,66,0.32)"/><text x="464.0" y="31.3" fill="#f47d42" font-size="8.5" text-anchor="middle" font-weight="600">Auto-discovery</text><path d="M14 42h506" stroke="rgba(255,255,255,.10)" opacity="1"/><path transform="translate(26 51)" d="M2.5 6.4l2.4 2.4 4.6-5" fill="none" stroke="#52b54b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="61" font-size="10.5"><tspan fill="rgba(255,255,255,.65)" font-weight="normal">Found </tspan><tspan fill="rgba(255,255,255,.85)" font-weight="700">1</tspan><tspan fill="rgba(255,255,255,.65)" font-weight="normal"> server</tspan></text><rect x="26" y="72" width="482" height="120" rx="4" fill="#2e2e2e" stroke="rgba(255,255,255,.10)"/><text x="38" y="91" fill="rgba(255,255,255,.85)" font-size="11.5" text-anchor="start" font-weight="600">Tower</text><rect x="38" y="99" width="362" height="22" rx="3" fill="rgba(0,0,0,.28)" stroke="#42a5f5"/><text x="46" y="114" fill="rgba(255,255,255,.85)" font-size="10" text-anchor="start" font-weight="normal">Local Container: 192.168.1.10:32400 (recommended)</text><path transform="translate(382 104)" d="M2.5 4.4l3.5 3.6 3.5-3.6" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="38" y="122" width="362" height="60" rx="3" fill="#1a1a1a" stroke="rgba(255,255,255,.18)"/><text x="46" y="138" fill="rgba(255,255,255,.65)" font-size="10" text-anchor="start" font-weight="normal">Local: 192.168.1.10:32400 (plex.direct)</text><text x="46" y="156" fill="rgba(255,255,255,.65)" font-size="10" text-anchor="start" font-weight="normal">Remote: 203.0.113.7:32400 (not optimal here)</text><text x="46" y="174" fill="rgba(255,255,255,.65)" font-size="10" text-anchor="start" font-weight="normal">Relay (via plex.tv) (slow fallback)</text><rect x="420" y="158" width="76" height="22" rx="3" fill="rgba(82,181,75,0.14)" stroke="rgba(82,181,75,0.4)"/><path transform="translate(428 163)" d="M6 2.5v7M2.5 6h7" fill="none" stroke="#52b54b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="465.0" y="172.8" fill="#52b54b" font-size="10" text-anchor="middle" font-weight="600">Add</text><rect x="14" y="214" width="506" height="38" rx="4" fill="#242424" stroke="rgba(255,255,255,.10)"/><rect x="26" y="222" width="65" height="22" rx="3" fill="rgba(82,181,75,0.14)" stroke="rgba(82,181,75,0.4)"/><path transform="translate(34 227)" d="M2.5 6.4l2.4 2.4 4.6-5" fill="none" stroke="#52b54b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="65.5" y="236.8" fill="#52b54b" font-size="10" text-anchor="middle" font-weight="600">Apply</text><rect x="99" y="222" width="125" height="22" rx="3" fill="#2e2e2e" stroke="rgba(255,255,255,.18)"/><text x="161.5" y="236.8" fill="rgba(255,255,255,.65)" font-size="10" text-anchor="middle" font-weight="600">Reset to Defaults</text><rect x="232" y="222" width="45" height="22" rx="3" fill="#2e2e2e" stroke="rgba(255,255,255,.18)"/><text x="254.5" y="236.8" fill="rgba(255,255,255,.65)" font-size="10" text-anchor="middle" font-weight="600">Done</text><path d="M540 110L404 110" stroke="#42a5f5" stroke-width="1.6" marker-end="url(#a)"/><text x="546" y="106" fill="#42a5f5" font-size="10.5" text-anchor="start" font-weight="600">Best first. Stay on the top one</text><text x="546" y="121" fill="#42a5f5" font-size="10.5" text-anchor="start" font-weight="600">unless Plex is on another network.</text><path d="M58 270L58 248" stroke="#42a5f5" stroke-width="1.6" marker-end="url(#a)"/><text x="26" y="284" fill="#42a5f5" font-size="10.5" text-anchor="start" font-weight="600">Nothing is saved until Apply: not an added server, not a removed one.</text></svg>